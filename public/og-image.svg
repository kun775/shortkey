<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="900" cy="180" r="320" fill="url(#glow)" />
  <circle cx="250" cy="450" r="260" fill="url(#glow)" />

  <!-- Logo Icon -->
  <g transform="translate(140, 150)">
    <rect width="80" height="80" rx="20" fill="#4F46E5" filter="url(#shadow)" />
    <path d="M35 43.75a11.25 11.25 0 0 0 15.9.9l6.25-6.25a11.25 11.25 0 0 0-15.9-15.9l-3.62 3.62" stroke="#FFFFFF" stroke-width="6.25" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 36.25a11.25 11.25 0 0 0-15.9-.9l-6.25 6.25a11.25 11.25 0 0 0 15.9 15.9l3.62-3.62" stroke="#FFFFFF" stroke-width="6.25" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Text -->
  <text x="245" y="210" font-family="JetBrains Mono, monospace, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF">sk.gs</text>

  <!-- Slogan Title -->
  <text x="140" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    <tspan fill="#818CF8">Short</tspan>
    <tspan fill="#38BDF8"> Key, </tspan>
    <tspan fill="#34D399">Go</tspan>
    <tspan fill="#FBBF24"> Swift.</tspan>
  </text>

  <!-- Description Subtitle -->
  <text x="140" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#94A3B8">
    极速、安全、无冗余的边缘短链接生成与管理服务
  </text>

  <!-- Feature Badges -->
  <g transform="translate(140, 440)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="190" height="46" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="95" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">⚡ 边缘 302 极速跳转</text>

    <!-- Badge 2 -->
    <rect x="210" y="0" width="190" height="46" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="305" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">🎯 支持自定义短码</text>

    <!-- Badge 3 -->
    <rect x="420" y="0" width="190" height="46" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="515" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">🔒 防环回死循环</text>

    <!-- Badge 4 -->
    <rect x="630" y="0" width="190" height="46" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="725" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">📊 实时访问统计</text>
  </g>
</svg>
